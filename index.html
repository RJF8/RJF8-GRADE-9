let db=null,supabaseLoadPromise=null;
const fallbackSubjects=[

['heavenly','پیام‌های آسمان','پیام‌ها','درس‌نامه و پرسش‌های پیام‌های آسمان','☼','#9c83db'],
['quran','قرآن','قرآن','روخوانی، پیام آیات و مفاهیم','۞','#45b58b'],
['defense','آمادگی دفاعی','دفاعی','مفاهیم و آمادگی دفاعی پایه نهم','🛡️','#d47a65'],
['technology','کار و فناوری','فناوری','مهارت‌های کاربردی و پروژه‌ها','⚙️','#7895a8'],
['art','فرهنگ و هنر','هنر','آشنایی با هنر و فعالیت‌های خلاقانه','🎨','#d58ab9']
].map((x,i)=>({slug:x[0],title:x[1],short_title:x[2],description:x[3],icon:x[4],accent:x[5],sort_order:i+1}));
let subjects=[],user=null,currentSubject=null,light=localStorage.getItem('rjf8-theme')==='light',signup=false,progress=[],activeView='home',progressLoadedFor=null,profileLoadedFor=null;
const lessonCache=new Map(),quizCache=new Map(),questionCache=new Map();
const $=id=>document.getElementById(id);

function applyTheme(){document.documentElement.dataset.theme=light?"light":"dark";$("themeBtn").textContent=light?"☾ حالت تیره":"☼ حالت روشن";localStorage.setItem("rjf8-theme",light?"light":"dark")}
function loadSupabaseLibrary(){
 if(window.supabase?.createClient)return Promise.resolve();
 if(supabaseLoadPromise)return supabaseLoadPromise;
 supabaseLoadPromise=new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.async=true;s.onload=()=>window.supabase?.createClient?resolve():reject(new Error("Supabase SDK unavailable"));s.onerror=()=>reject(new Error("Supabase SDK failed to load"));document.head.appendChild(s)});
 return supabaseLoadPromise
}
function updateAccountUI(){
 $("authLabel").textContent=user?"خروج از حساب":"ورود / ثبت‌نام";
 $("accountBtn").textContent=user?"حساب من":"ورود";
 $("avatar").textContent=user?(user.email||"R").slice(0,1).toUpperCase():"R";
 if(!user&&$("xpStat"))$("xpStat").textContent="۰ XP"
}
function handleSession(session){
 const next=session?.user||null,oldId=user?.id||null,newId=next?.id||null;
 user=next;updateAccountUI();
 if(oldId===newId)return;
 progress=[];progressLoadedFor=null;profileLoadedFor=null;
 if(!user){home();return}
 Promise.all([loadProfile(),loadProgress()]).then(()=>{if(activeView==="home")home();if(activeView==="progress")progressView()}).catch(()=>toast("بارگذاری اطلاعات حساب کامل نشد"))
}

function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function setView(name){activeView=name;document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));$('sidebar').classList.remove('open');if(name==='home')home();if(name==='subjects')subjectList();if(name==='progress')progressView();if(name==='quizzes')quizView()}
function subjectCards(list){return '<div class="subject-grid">'+list.map(s=>`<button class="subject" data-subject="${s.slug}"><div class="subject-icon" style="color:${s.accent};background:${s.accent}20">${s.icon}</div><strong>${s.title}</strong><p>${s.description||'محتوای آموزشی و تمرین‌های این درس'}</p><div class="subject-foot"><span>پایه نهم</span><span>مشاهده درس‌ها ←</span></div></button>`).join('')+'</div>'}
function bindSubjects(){document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>openSubject(b.dataset.subject))}
function home(){ $('crumb').textContent='داشبورد';$('view').innerHTML=`<section class="hero"><div class="eyebrow">RJF8 • GRADE 9 LEARNING SPACE</div><div class="hero-row"><div><h1>مسیر یادگیری پایه نهم<br>از اینجا شروع می‌شود.</h1><p>همه درس‌های پایه نهم را در یک فضای منظم دنبال کن؛ درس بخوان، تمرین کن و قدم‌به‌قدم پیشرفتت را بساز.</p></div><button class="hero-btn" id="startLearning">رفتن به درس‌ها ←</button></div></section><div class="stats"><div class="stat"><span class="sym">✦</span><small>امتیاز تجربه</small><strong id="xpStat">۰ XP</strong></div><div class="stat"><span class="sym">▦</span><small>درس‌های موجود</small><strong>${subjects.length}</strong></div><div class="stat"><span class="sym">✓</span><small>درس‌های تکمیل‌شده</small><strong>${progress.filter(p=>p.status==='completed').length}</strong></div><div class="stat"><span class="sym">◉</span><small>وضعیت حساب</small><strong style="font-size:16px">${user?'متصل':'مهمان'}</strong></div></div><div class="section-head"><div><h2>درس‌ها</h2><p>یازده حوزه آموزشی پایه نهم</p></div><button class="pill" id="allSubjects">مشاهده همه ←</button></div>${subjectCards(subjects.slice(0,6))}`;
$('startLearning').onclick=()=>setView('subjects');$('allSubjects').onclick=()=>setView('subjects');bindSubjects()}
function subjectList(){
 $('crumb').textContent='همه درس‌ها';
 $('view').innerHTML='<div class="section-head"><div><h2>همه درس‌های پایه نهم</h2><p>جست‌وجو کن و درس مورد نظرت را انتخاب کن.</p></div></div><input id="subjectSearch" class="field" placeholder="جست‌وجوی نام درس..." style="max-width:420px"><div id="subjectResults">'+subjectCards(subjects)+'</div>';
 const render=term=>{const list=subjects.filter(s=>(s.title+' '+s.description).toLowerCase().includes(term.toLowerCase()));$('subjectResults').innerHTML=list.length?subjectCards(list):'<div class="content-panel empty">درسی با این عبارت پیدا نشد.</div>';bindSubjects()};
 $('subjectSearch').addEventListener('input',e=>render(e.target.value));bindSubjects()
}
async function openSubject(slug){
 currentSubject=subjects.find(s=>s.slug===slug);if(!currentSubject)return;
 activeView="subject";$("crumb").textContent=currentSubject.short_title;
 $("view").innerHTML='<button class="back" id="backSubjects">← بازگشت به درس‌ها</button><section class="hero subject-hero"><div class="eyebrow">SUBJECT / GRADE 9</div><h1>'+currentSubject.icon+' '+currentSubject.title+'</h1><p>'+(currentSubject.description||"محتوای آموزشی این درس")+'</p></section><div class="section-head"><div><h2>درس‌نامه‌ها و تمرین‌ها</h2><p>درس را باز کن و پس از مطالعه در آزمون شرکت کن.</p></div></div><div class="content-panel" id="lessonsPanel"><div class="empty">در حال دریافت درس‌ها…</div></div>';
 $("backSubjects").onclick=()=>setView("subjects");
 if(!db){$("lessonsPanel").innerHTML='<div class="empty">در حال اتصال به سرور… کمی بعد دوباره تلاش کن.</div>';return}
 let rows=lessonCache.get(slug);
 if(!rows){const res=await db.from("lessons").select("id,title,summary,lesson_number,estimated_minutes").eq("subject_id",currentSubject.id).eq("is_published",true).order("lesson_number");if(res.error){$("lessonsPanel").innerHTML='<div class="empty">دریافت درس‌ها ناموفق بود. اتصال را بررسی و دوباره تلاش کن.</div>';return}rows=res.data||[];lessonCache.set(slug,rows)}
 const panel=$("lessonsPanel");if(!rows.length){panel.innerHTML='<div class="empty">هنوز درس‌نامه‌ای برای این بخش منتشر نشده است.</div>';return}
 panel.innerHTML=rows.map(l=>'<div class="lesson-row"><div><b>'+l.lesson_number+'. '+l.title+'</b><small>'+(l.summary||"درس‌نامه و تمرین")+' • '+(l.estimated_minutes||15)+' دقیقه</small></div><button data-lesson="'+l.id+'">مطالعه درس ←</button></div>').join("");
 panel.querySelectorAll("[data-lesson]").forEach(btn=>btn.onclick=()=>openLesson(btn.dataset.lesson))
}
async function openLesson(id){
 if(!db)return toast("اتصال به سرور برقرار نیست");
 let data=lessonCache.get("lesson:"+id),quiz=quizCache.get("lesson:"+id);
 if(!data||quiz===undefined){
  const jobs=[];
  jobs.push(data?Promise.resolve({data,error:null}):db.from("lessons").select("id,title,content,estimated_minutes,lesson_number").eq("id",id).single());
  jobs.push(quiz!==undefined?Promise.resolve({data:quiz,error:null}):db.from("quizzes").select("id,title,question_count").eq("lesson_id",id).eq("is_published",true).maybeSingle());
  const results=await Promise.all(jobs),lessonRes=results[0],quizRes=results[1];
  if(lessonRes.error||!lessonRes.data){toast("دریافت درس انجام نشد");return}
  data=lessonRes.data;quiz=quizRes.data||null;lessonCache.set("lesson:"+id,data);quizCache.set("lesson:"+id,quiz)
 }
 const subject=currentSubject||{title:"پایه نهم",slug:""};
 activeView="lesson";$("crumb").textContent=data.title;
 $("view").innerHTML='<button class="back" id="backLesson">← بازگشت به فهرست</button><div class="section-head"><div><h2>'+data.title+'</h2><p>'+subject.title+' • حدود '+(data.estimated_minutes||15)+' دقیقه مطالعه</p></div></div><article class="content-panel lesson-content" style="line-height:2.25;font-size:14px">'+(data.content?.html||'<div class="empty">محتوای این درس هنوز آماده نشده است.</div>')+'</article><div class="content-panel" style="margin-top:14px"><b>پایان مطالعه</b><p style="color:var(--muted);font-size:12px">با ثبت مطالعه یا شرکت در آزمون، روند یادگیری‌ات ذخیره می‌شود.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" id="completeLesson">ثبت مطالعه به‌عنوان تکمیل‌شده</button>'+(quiz?'<button class="pill" id="lessonQuiz">شروع آزمون ('+quiz.question_count+' پرسش)</button>':"")+'</div></div>';
 $("backLesson").onclick=()=>openSubject(subject.slug);
 $("completeLesson").onclick=async()=>{if(!user){showAuth();return}const btn=$("completeLesson");btn.disabled=true;const res=await db.from("lesson_progress").upsert({user_id:user.id,lesson_id:id,status:"completed",progress_percent:100,last_seen_at:new Date().toISOString(),completed_at:new Date().toISOString()});btn.disabled=false;if(res.error)toast("ذخیره پیشرفت ناموفق بود");else{progressLoadedFor=null;await loadProgress();toast("درس تکمیل‌شده ثبت شد");setView("progress")}};
 if(quiz)$("lessonQuiz").onclick=()=>startQuiz(quiz.id,quiz.title)
}
async function loadProgress(){if(!user||!db){progress=[];progressLoadedFor=null;return}if(progressLoadedFor===user.id)return;const uid=user.id;const res=await db.from('lesson_progress').select('id,lesson_id,status,progress_percent,last_seen_at,completed_at').eq('user_id',uid).order('last_seen_at',{ascending:false}).limit(300);if(res.error)throw res.error;if(user?.id!==uid)return;progress=res.data||[];progressLoadedFor=uid}
async function progressView(){
 $("crumb").textContent="مسیر پیشرفت";$("view").innerHTML='<div class="section-head"><div><h2>مسیر پیشرفت</h2><p>مرور فعالیت‌های آموزشی حساب کاربری</p></div></div><div class="content-panel" id="progressPanel"><div class="empty">در حال بارگذاری…</div></div>';
 if(!user){$("progressPanel").innerHTML='<div class="empty">برای ثبت و مشاهده پیشرفت، ابتدا وارد حساب کاربری شو.<br><button class="primary" id="progressLogin">ورود / ثبت‌نام</button></div>';$("progressLogin").onclick=showAuth;return}
 try{await loadProgress()}catch(e){$("progressPanel").innerHTML='<div class="empty">بارگذاری پیشرفت ناموفق بود. دوباره تلاش کن.</div>';return}
 $("progressPanel").innerHTML=progress.length?progress.map(p=>{const lesson=Array.from(lessonCache.values()).find(x=>x&&x.id===p.lesson_id);return '<div class="lesson-row"><div><b>'+(lesson?.title||(p.status==="completed"?"درس تکمیل‌شده":"در حال یادگیری"))+'</b><small>'+(p.progress_percent||0)+'% پیشرفت</small></div><span>'+(p.last_seen_at?new Date(p.last_seen_at).toLocaleDateString("fa-IR"):"-")+'</span></div>'}).join(""):'<div class="empty">هنوز فعالیتی ثبت نشده است. از بخش درس‌ها شروع کن.</div>'
}
async function quizView(){
 activeView='quizzes';$('crumb').textContent='آزمون‌ها';
 $('view').innerHTML='<div class="section-head"><div><h2>آزمون‌ها و سنجش</h2><p>آزمون‌های منتشرشده همه درس‌ها</p></div></div><div class="content-panel" id="quizList"><div class="empty">در حال دریافت آزمون‌ها…</div></div>';
 if(!db){$('quizList').innerHTML='<div class="empty">اتصال پایگاه داده در دسترس نیست.</div>';return}
 let data=quizCache.get('catalogue'),error=null;if(!data){const res=await db.from('quizzes').select('id,title,description,question_count,lessons!inner(title,subject_id)').eq('is_published',true).order('created_at',{ascending:false});data=res.data;error=res.error;if(!error)quizCache.set('catalogue',data||[])}
 if(error){$('quizList').innerHTML='<div class="empty">دریافت آزمون‌ها ناموفق بود.</div>';return}
 if(!data?.length){$('quizList').innerHTML='<div class="empty">هنوز آزمونی منتشر نشده است.</div>';return}
 $('quizList').innerHTML=data.map(q=>{const s=subjects.find(x=>x.id===q.lessons?.subject_id);return `<div class="lesson-row"><div><b>${q.title}</b><small>${s?.title||'پایه نهم'} • ${q.question_count} پرسش • ${q.lessons?.title||''}</small></div><button data-quiz="${q.id}" data-title="${q.title}">شروع آزمون</button></div>`}).join('');
 $('quizList').querySelectorAll('[data-quiz]').forEach(btn=>btn.onclick=()=>startQuiz(btn.dataset.quiz,btn.dataset.title))
}
async function startQuiz(id,title){
 activeView='quiz';if(!user){showAuth();toast('برای ذخیره نتیجه ابتدا وارد حساب شو');return}
 let questions=questionCache.get(id),error=null;if(!questions){const res=await db.from('quiz_questions').select('id,prompt,options,explanation,sort_order').eq('quiz_id',id).order('sort_order');questions=res.data;error=res.error;if(!error)questionCache.set(id,questions||[])}
 if(error||!questions?.length){toast('پرسش‌های آزمون دریافت نشدند');return}
 const answers={};
 $('crumb').textContent='آزمون';
 $('view').innerHTML=`<button class="back" id="exitQuiz">← بازگشت به آزمون‌ها</button><div class="section-head"><div><h2>${title}</h2><p>${questions.length} پرسش • هر پاسخ را انتخاب کن و در پایان نتیجه را ثبت کن.</p></div></div><div class="content-panel"><div class="lesson-row"><b>پاسخ‌های انتخاب‌شده</b><span id="answerCount">۰ از ${questions.length}</span></div><div id="questionList"></div><button class="primary" id="submitQuiz" style="margin-top:18px">ثبت نهایی پاسخ‌ها</button></div>`;
 $('exitQuiz').onclick=()=>quizView();
 $('questionList').innerHTML=questions.map((q,i)=>`<section class="question-card" style="padding:18px 4px;border-bottom:1px solid var(--line)"><div style="color:var(--primary);font-size:11px;font-weight:800">پرسش ${i+1} از ${questions.length}</div><h3 style="font-size:15px;line-height:2;margin:8px 0 13px">${q.prompt}</h3><div class="option-list">${q.options.map((opt,j)=>`<button class="quiz-option" data-q="${q.id}" data-opt="${j}">${['الف','ب','ج','د','هـ'][j]||j+1}) ${opt}</button>`).join('')}</div></section>`).join('');
 $('questionList').querySelectorAll('.quiz-option').forEach(btn=>btn.onclick=()=>{const qid=btn.dataset.q;answers[qid]=Number(btn.dataset.opt);document.querySelectorAll('.quiz-option[data-q="'+qid+'"]').forEach(x=>x.classList.toggle('chosen',x===btn));$('answerCount').textContent=Object.keys(answers).length+' از '+questions.length});
 $('submitQuiz').onclick=async()=>{if(Object.keys(answers).length!==questions.length){toast('لطفاً به همه پرسش‌ها پاسخ بده');return}const submit=$('submitQuiz');submit.disabled=true;submit.textContent='در حال ثبت نتیجه…';const {data:result,error}=await db.rpc('submit_quiz_attempt',{p_quiz_id:id,p_answers:answers});if(error){submit.disabled=false;submit.textContent='ثبت نهایی پاسخ‌ها';toast(error.message||'ثبت آزمون ناموفق بود');return}profileLoadedFor=null;progressLoadedFor=null;await Promise.all([loadProfile(),loadProgress()]);const pct=Number(result.score||0);$('view').innerHTML=`<section class="hero"><div class="eyebrow">QUIZ RESULT</div><h1>آزمون به پایان رسید</h1><p>نتیجه‌ات با موفقیت ذخیره شد.</p><div class="stats"><div class="stat"><small>نمره</small><strong>${pct}٪</strong></div><div class="stat"><small>پاسخ درست</small><strong>${result.correct_count} / ${result.total_count}</strong></div><div class="stat"><small>امتیاز کسب‌شده</small><strong>${result.xp_earned} XP</strong></div><div class="stat"><small>وضعیت درس</small><strong style="font-size:15px">${pct>=70?'تکمیل‌شده':'نیاز به مرور'}</strong></div></div></section><div class="section-head"><div><h2>مرور پاسخ‌ها</h2><p>توضیح هر پرسش برای یادگیری بهتر</p></div></div><div class="content-panel">${questions.map((q,i)=>`<div class="lesson-row" style="display:block"><b>${i+1}. ${q.prompt}</b><small style="white-space:normal;line-height:2">${q.explanation||'برای این پرسش توضیحی ثبت نشده است.'}</small></div>`).join('')}</div><button class="primary" id="backQuizList" style="margin-top:18px">بازگشت به آزمون‌ها</button>`;$('backQuizList').onclick=()=>quizView();};
}
async function loadProfile(){if(!user||!db)return;const uid=user.id;if(profileLoadedFor===uid)return;let {data,error}=await db.from('profiles').select('id,display_name,xp,level').eq('id',uid).maybeSingle();if(error)throw error;if(!data){const created=await db.from('profiles').insert({id:uid,display_name:user.user_metadata?.display_name||''}).select('id,display_name,xp,level').single();if(created.error&&created.error.code!=='23505')throw created.error;data=created.data||{xp:0,display_name:user.user_metadata?.display_name||''}}if(user?.id!==uid)return;$('xpStat').textContent=(data.xp||0)+' XP';$('avatar').textContent=(data.display_name||user.email||'R').slice(0,1).toUpperCase();profileLoadedFor=uid}
function showAuth(){if(!db){toast('در حال اتصال به سرور؛ چند لحظه دیگر تلاش کن');return}signup=false;authMode();$('authModal').classList.add('show')}
function authMode(){$('authTitle').textContent=signup?'ساخت حساب کاربری':'ورود به حساب';$('authSubmit').textContent=signup?'ثبت‌نام':'ورود';$('displayName').style.display=signup?'block':'none';$('authSwitch').textContent=signup?'قبلاً حساب ساختی؟ وارد شو':'حساب نداری؟ ثبت‌نام کن'}
$('authSwitch').onclick=()=>{signup=!signup;authMode()};$('authClose').onclick=()=>$('authModal').classList.remove('show');$('authModal').onclick=e=>{if(e.target===$('authModal'))$('authModal').classList.remove('show')};
$('authForm').onsubmit=async e=>{e.preventDefault();if(!db){toast('اتصال پایگاه داده برقرار نیست');return}const submit=$('authSubmit');if(submit.disabled)return;submit.disabled=true;const wasSignup=signup;submit.textContent=wasSignup?'در حال ساخت حساب…':'در حال ورود…';try{const email=$('email').value.trim(),password=$('password').value;const res=wasSignup?await db.auth.signUp({email,password,options:{data:{display_name:$('displayName').value.trim()}}}):await db.auth.signInWithPassword({email,password});if(res.error)throw res.error;if(wasSignup&&!res.data.session){toast('ثبت‌نام انجام شد؛ ایمیلت را برای تأیید بررسی کن.');$('authModal').classList.remove('show');return}$('authModal').classList.remove('show');toast(wasSignup?'حساب ساخته شد':'خوش برگشتی')}catch(err){const msg=err?.message||'خطای ناشناخته';toast(msg.includes('Invalid login credentials')?'ایمیل یا رمز عبور اشتباه است':msg.includes('User already registered')?'این ایمیل قبلاً ثبت‌نام کرده است':msg)}finally{submit.disabled=false;authMode()}}
$('authNav').onclick=async()=>{if(user){const btn=$('authNav');btn.disabled=true;const {error}=await db.auth.signOut();btn.disabled=false;if(error)toast('خروج از حساب انجام نشد: '+error.message);else toast('با موفقیت خارج شدی')}else showAuth()};$('accountBtn').onclick=()=>user?setView('progress'):showAuth();
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');document.addEventListener('click',e=>{if(window.innerWidth<=700&&$('sidebar').classList.contains('open')&&!$('sidebar').contains(e.target)&&e.target!==$('menuBtn'))$('sidebar').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('sidebar').classList.remove('open')});
$('themeBtn').onclick=()=>{light=!light;applyTheme()};
async function init(){if(light){document.documentElement.style.setProperty('--bg','#f2f5fb');document.documentElement.style.setProperty('--panel','#ffffff');document.documentElement.style.setProperty('--panel2','#edf1f8');document.documentElement.style.setProperty('--line','#dce3ef');document.documentElement.style.setProperty('--text','#17233a');document.documentElement.style.setProperty('--muted','#65738b');$('themeBtn').textContent='☾ حالت تیره'}if(!db){toast('کتابخانه اتصال بارگذاری نشد');subjects=fallbackSubjects;home();return}let {data,error}=await db.from('subjects').select('*').eq('is_published',true).order('sort_order');subjects=(!error&&data?.length)?data:fallbackSubjects;await syncAuth();db.auth.onAuthStateChange(()=>setTimeout(syncAuth,0))}
init();
</script></body></html>
