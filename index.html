<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#34306b55,transparent 38%),var(--bg);color:var(--text);font-family:Vazirmatn,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.sidebar{border-left:1px solid var(--line);padding:25px 18px;background:#0b1222d9;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:12px;padding:5px 8px}.brand-mark{width:43px;height:43px;border-radius:15px;background:linear-gradient(135deg,#8b83ff,#50d7d0);display:grid;place-items:center;color:#0b1020;font-weight:900;font-size:21px;box-shadow:0 8px 25px #7770ff44}.brand b{display:block;font-size:15px;letter-spacing:.4px}.brand small{color:var(--muted);font-size:11px}.nav-label{color:#667792;font-size:10px;font-weight:800;padding:0 12px;letter-spacing:1px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#9cabc3;text-align:right;padding:12px 13px;border-radius:13px;display:flex;align-items:center;gap:12px;font-size:13px;transition:.2s}.nav button:hover,.nav button.active{background:#8b83ff1c;color:#fff}.nav button.active{box-shadow:inset -3px 0 var(--primary)}.nav .ico{width:23px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;background:linear-gradient(145deg,#242450,#172d43);border:1px solid #ffffff12;padding:16px;border-radius:17px}.side-bottom strong{font-size:13px}.side-bottom p{font-size:11px;color:#b1bfd6;line-height:1.9;margin:6px 0 0}.main{padding:27px clamp(16px,3vw,42px) 55px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:28px}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);background:#111a2d;color:var(--text);padding:9px 13px;border-radius:12px;font-size:12px}.avatar{width:38px;height:38px;border-radius:13px;background:#2c3556;display:grid;place-items:center;font-weight:800}.hero{border:1px solid #7770ff44;border-radius:24px;padding:clamp(22px,4vw,38px);background:linear-gradient(115deg,#242450 0%,#182d49 55%,#143b48 100%);position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"∑";position:absolute;left:5%;top:-50px;font-size:230px;color:#fff0a;opacity:.07;font-weight:900;pointer-events:none}.eyebrow{color:#b8b5ff;font-size:11px;font-weight:800;letter-spacing:1px}.hero h1{font-size:clamp(25px,4vw,39px);margin:10px 0 8px;line-height:1.5}.hero p{color:#c0cbe0;max-width:620px;font-size:13px;line-height:2.1;margin:0}.hero-row{display:flex;justify-content:space-between;align-items:end;gap:20px}.hero-btn,.primary{background:linear-gradient(110deg,#928aff,#5d9df5);border:0;color:white;padding:12px 18px;border-radius:12px;font-weight:800;font-size:12px;box-shadow:0 8px 24px #6d7aff44}.section-head{display:flex;justify-content:space-between;align-items:end;margin:31px 0 15px}.section-head h2{font-size:18px;margin:0}.section-head p{color:var(--muted);font-size:11px;margin:5px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:17px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:24px;margin-top:5px}.stat .sym{float:left;color:var(--cyan);font-size:18px}.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.subject{border:1px solid var(--line);background:linear-gradient(145deg,#151f34,#10192b);border-radius:18px;padding:17px;text-align:right;color:var(--text);transition:.22s;min-height:150px;position:relative;overflow:hidden}.subject:hover{transform:translateY(-3px);border-color:#7770ff88;box-shadow:0 12px 30px #0003}.subject-icon{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:#7770ff20;margin-bottom:13px}.subject strong{font-size:14px;display:block}.subject p{font-size:11px;line-height:1.8;color:var(--muted);margin:5px 0 12px}.subject-foot{display:flex;justify-content:space-between;color:#8f9db5;font-size:10px}.subject-foot span:last-child{color:var(--cyan)}.content-panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:20px}.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:13px;line-height:2}.lesson-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}.lesson-row:last-child{border:0}.lesson-row b{font-size:13px}.lesson-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.lesson-row button{background:#7770ff22;color:#c5c0ff;border:1px solid #7770ff44;padding:8px 12px;border-radius:10px;font-size:11px}.back{background:transparent;color:var(--muted);border:0;font-size:12px;margin-bottom:16px}.modal{position:fixed;inset:0;background:#050914cc;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.dialog{width:min(430px,100%);background:#131e32;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}.dialog h2{margin:0 0 8px}.dialog p{font-size:12px;color:var(--muted);line-height:1.9}.field{width:100%;background:#0b1425;border:1px solid var(--line);border-radius:11px;padding:12px;color:white;margin:7px 0 12px;outline:none}.field:focus{border-color:var(--primary)}.dialog .primary{width:100%}.link-btn{background:none;border:0;color:#aaa5ff;font-size:12px;margin-top:12px}.toast{position:fixed;bottom:20px;left:20px;background:#17253b;border:1px solid var(--line);padding:12px 16px;border-radius:12px;font-size:12px;display:none;z-index:30}.toast.show{display:block}.mobile-menu{display:none}
@media(max-width:950px){.subject-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:15;top:0;right:0;width:270px;transform:translateX(105%);transition:.25s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.main{padding:18px 14px 40px}.mobile-menu{display:inline-flex}.topbar{margin-bottom:18px}.hero{border-radius:19px}.hero-row{display:block}.hero-btn{margin-top:17px}.subject-grid{grid-template-columns:1fr 1fr;gap:9px}.subject{padding:13px;min-height:148px}.subject p{font-size:10px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.section-head{margin-top:25px}.top-actions .pill{padding:8px}.side-bottom{display:none}}
@media(max-width:390px){.subject-grid{grid-template-columns:1fr}.hero h1{font-size:25px}}

<body>

 <div id="view"></div>
</main></div>
<div class="modal" id="authModal"><div class="dialog"><h2 id="authTitle">ورود به حساب</h2><p>برای ذخیره روند یادگیری و مشاهده پیشرفتت وارد شو.</p><form id="authForm"><input class="field" id="displayName" placeholder="نام نمایشی (برای ثبت‌نام)" style="display:none"><input class="field" id="email" type="email" placeholder="ایمیل" required><input class="field" id="password" type="password" placeholder="رمز عبور" minlength="6" required><button class="primary" id="authSubmit">ورود</button></form><button class="link-btn" id="authSwitch">حساب نداری؟ ثبت‌نام کن</button><button class="link-btn" id="authClose" style="float:left">بستن</button></div></div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://gbuomuxrgmombwgsftce.supabase.co';
const SUPABASE_KEY='sb_publishable_HK5sAbMVgWYoLqVkhft57Q_bjCwAlGg';
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const fallbackSubjects=[
['math','ریاضی نهم','ریاضی','درس‌نامه، تمرین و آزمون‌های مرحله‌ای ریاضی نهم','∑','#7777ff'],
['science','علوم تجربی','علوم','مفاهیم، آزمایش‌ها و پرسش‌های علوم نهم','⚗️','#22b8a7'],
['persian','فارسی و نگارش','فارسی','معنی، آرایه، دستور زبان و نگارش','✒️','#e6a23c'],
['arabic','عربی','عربی','ترجمه، قواعد و تمرین‌های عربی نهم','أ','#ed7897'],
['english','زبان انگلیسی','انگلیسی','واژگان، گرامر، مکالمه و درک مطلب','文','#5c9bea'],
['social','مطالعات اجتماعی','مطالعات','تاریخ، جغرافیا و مدنی','🌍','#45a7c8'],
['heavenly','پیام‌های آسمان','پیام‌ها','درس‌نامه و پرسش‌های پیام‌های آسمان','☼','#9c83db'],
['quran','قرآن','قرآن','روخوانی، پیام آیات و مفاهیم','۞','#45b58b'],
['defense','آمادگی دفاعی','دفاعی','مفاهیم و آمادگی دفاعی پایه نهم','🛡️','#d47a65'],
['technology','کار و فناوری','فناوری','مهارت‌های کاربردی و پروژه‌ها','⚙️','#7895a8'],
['art','فرهنگ و هنر','هنر','آشنایی با هنر و فعالیت‌های خلاقانه','🎨','#d58ab9']
].map((x,i)=>({slug:x[0],title:x[1],short_title:x[2],description:x[3],icon:x[4],accent:x[5],sort_order:i+1}));
let subjects=[],user=null,currentSubject=null,light=false,signup=false,progress=[];
const $=id=>document.getElementById(id);
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function setView(name){document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));$('sidebar').classList.remove('open');if(name==='home')home();if(name==='subjects')subjectList();if(name==='progress')progressView();if(name==='quizzes')quizView()}
function subjectCards(list){return '<div class="subject-grid">'+list.map(s=>`<button class="subject" data-subject="${s.slug}"><div class="subject-icon" style="color:${s.accent};background:${s.accent}20">${s.icon}</div><strong>${s.title}</strong><p>${s.description||'محتوای آموزشی و تمرین‌های این درس'}</p><div class="subject-foot"><span>پایه نهم</span><span>مشاهده درس‌ها ←</span></div></button>`).join('')+'</div>'}
function bindSubjects(){document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>openSubject(b.dataset.subject))}
function home(){ $('crumb').textContent='داشبورد';$('view').innerHTML=`<section class="hero"><div class="eyebrow">RJF8 • GRADE 9 LEARNING SPACE</div><div class="hero-row"><div><h1>مسیر یادگیری پایه نهم<br>از اینجا شروع می‌شود.</h1><p>همه درس‌های پایه نهم را در یک فضای منظم دنبال کن؛ درس بخوان، تمرین کن و قدم‌به‌قدم پیشرفتت را بساز.</p></div><button class="hero-btn" id="startLearning">رفتن به درس‌ها ←</button></div></section><div class="stats"><div class="stat"><span class="sym">✦</span><small>امتیاز تجربه</small><strong id="xpStat">۰ XP</strong></div><div class="stat"><span class="sym">▦</span><small>درس‌های موجود</small><strong>${subjects.length}</strong></div><div class="stat"><span class="sym">✓</span><small>درس‌های تکمیل‌شده</small><strong>${progress.filter(p=>p.status==='completed').length}</strong></div><div class="stat"><span class="sym">◉</span><small>وضعیت حساب</small><strong style="font-size:16px">${user?'متصل':'مهمان'}</strong></div></div><div class="section-head"><div><h2>درس‌ها</h2><p>یازده حوزه آموزشی پایه نهم</p></div><button class="pill" id="allSubjects">مشاهده همه ←</button></div>${subjectCards(subjects.slice(0,6))}`;
$('startLearning').onclick=()=>setView('subjects');$('allSubjects').onclick=()=>setView('subjects');bindSubjects();if(user)loadProfile()}
function subjectList(){ $('crumb').textContent='همه درس‌ها';$('view').innerHTML='<div class="section-head"><div><h2>همه درس‌های پایه نهم</h2><p>یک درس را انتخاب کن تا فصل‌ها و محتوای آن را ببینی.</p></div></div>'+subjectCards(subjects);bindSubjects()}
async function openSubject(slug){currentSubject=subjects.find(s=>s.slug===slug);if(!currentSubject)return;$('crumb').textContent=currentSubject.short_title;$('view').innerHTML=`<button class="back" id="backSubjects">← بازگشت به درس‌ها</button><section class="hero" style="background:linear-gradient(115deg,${currentSubject.accent}55,#172d49)"><div class="eyebrow">SUBJECT / GRADE 9</div><h1>${currentSubject.icon} ${currentSubject.title}</h1><p>${currentSubject.description||'محتوای آموزشی این درس'}</p></section><div class="section-head"><div><h2>فهرست درس‌ها</h2><p>محتوای منتشرشده این درس</p></div></div><div class="content-panel" id="lessonsPanel"><div class="empty">در حال دریافت درس‌ها…</div></div>`;$('backSubjects').onclick=()=>subjectList();let {data,error}=await db.from('lessons').select('id,title,summary,lesson_number,estimated_minutes').eq('subject_id',currentSubject.id).eq('is_published',true).order('lesson_number');const panel=$('lessonsPanel');if(error||!data?.length){panel.innerHTML='<div class="empty">هنوز درس‌نامه‌ای برای این بخش منتشر نشده است.<br>محتوای این درس پس از آماده‌سازی از پنل آموزشی اضافه می‌شود.</div>';return}panel.innerHTML=data.map(l=>`<div class="lesson-row"><div><b>${l.lesson_number}. ${l.title}</b><small>${l.summary||'درس‌نامه و تمرین'} • ${l.estimated_minutes} دقیقه</small></div><button data-lesson="${l.id}">مشاهده</button></div>`).join('');panel.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson))}
async function openLesson(id){let {data,error}=await db.from('lessons').select('*').eq('id',id).single();if(error||!data){toast('دریافت درس انجام نشد');return}if(user){await db.from('lesson_progress').upsert({user_id:user.id,lesson_id:id,status:'started',progress_percent:10,last_seen_at:new Date().toISOString()})}const c=data.content||{};$('view').innerHTML=`<button class="back" onclick="openSubject('${currentSubject.slug}')">← بازگشت به فهرست</button><div class="section-head"><div><h2>${data.title}</h2><p>${currentSubject.title} • ${data.estimated_minutes} دقیقه</p></div></div><article class="content-panel" style="line-height:2.2;font-size:14px">${c.html||'<div class="empty">محتوای کامل این درس هنوز منتشر نشده است.</div>'}</article><button class="primary" id="completeLesson" style="margin-top:16px">علامت‌گذاری به‌عنوان تکمیل‌شده</button>`;$('completeLesson').onclick=async()=>{if(!user){showAuth();return}let {error}=await db.from('lesson_progress').upsert({user_id:user.id,lesson_id:id,status:'completed',progress_percent:100,last_seen_at:new Date().toISOString(),completed_at:new Date().toISOString()});if(error)toast('ذخیره پیشرفت ناموفق بود');else{toast('پیشرفت ذخیره شد');await loadProgress()}}}
async function loadProgress(){if(!user){progress=[];return}let {data}=await db.from('lesson_progress').select('*').eq('user_id',user.id);progress=data||[]}
function progressView(){ $('crumb').textContent='مسیر پیشرفت';$('view').innerHTML='<div class="section-head"><div><h2>مسیر پیشرفت</h2><p>مرور فعالیت‌های آموزشی حساب کاربری</p></div></div><div class="content-panel" id="progressPanel"><div class="empty">در حال بارگذاری…</div></div>';if(!user){$('progressPanel').innerHTML='<div class="empty">برای ثبت و مشاهده پیشرفت، ابتدا وارد حساب کاربری شو.<br><button class="primary" onclick="showAuth()">ورود / ثبت‌نام</button></div>';return}loadProgress().then(()=>{$('progressPanel').innerHTML=progress.length?progress.map(p=>`<div class="lesson-row"><div><b>${p.status==='completed'?'✓ تکمیل‌شده':'در حال یادگیری'}</b><small>${p.progress_percent}% پیشرفت</small></div><span>${new Date(p.last_seen_at).toLocaleDateString('fa-IR')}</span></div>`).join(''):'<div class="empty">هنوز فعالیتی ثبت نشده است. از بخش درس‌ها شروع کن.</div>'})}
function quizView(){$('crumb').textContent='آزمون‌ها';$('view').innerHTML='<div class="section-head"><div><h2>آزمون‌ها و سنجش</h2><p>آزمون‌های هر درس در کنار محتوای آموزشی قرار می‌گیرند.</p></div></div><div class="content-panel"><div class="empty">هنوز آزمون منتشر نشده است.<br>به‌زودی آزمون‌های مرحله‌ای و تمرین‌های هر درس به این بخش اضافه می‌شوند.</div></div>'}
async function loadProfile(){if(!user)return;let {data}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(data){$('xpStat').textContent=data.xp+' XP';$('avatar').textContent=(data.display_name||user.email||'R').slice(0,1).toUpperCase()}}
function showAuth(){signup=false;authMode();$('authModal').classList.add('show')}
function authMode(){$('authTitle').textContent=signup?'ساخت حساب کاربری':'ورود به حساب';$('authSubmit').textContent=signup?'ثبت‌نام':'ورود';$('displayName').style.display=signup?'block':'none';$('authSwitch').textContent=signup?'قبلاً حساب ساختی؟ وارد شو':'حساب نداری؟ ثبت‌نام کن'}
$('authSwitch').onclick=()=>{signup=!signup;authMode()};$('authClose').onclick=()=>$('authModal').classList.remove('show');$('authModal').onclick=e=>{if(e.target===$('authModal'))$('authModal').classList.remove('show')};
$('authForm').onsubmit=async e=>{e.preventDefault();if(!db){toast('اتصال پایگاه داده برقرار نیست');return}let email=$('email').value,password=$('password').value;let res=signup?await db.auth.signUp({email,password,options:{data:{display_name:$('displayName').value}}}):await db.auth.signInWithPassword({email,password});if(res.error){toast(res.error.message);return}if(signup&&!res.data.session){toast('ثبت‌نام انجام شد؛ ایمیلت را برای تأیید بررسی کن.');$('authModal').classList.remove('show');return}user=res.data.user;$('authModal').classList.remove('show');await syncAuth();toast(signup?'حساب ساخته شد':'خوش برگشتی')}
async function syncAuth(){if(!db)return;let {data}=await db.auth.getSession();user=data.session?.user||null;$('authLabel').textContent=user?'خروج از حساب':'ورود / ثبت‌نام';$('accountBtn').textContent=user?'حساب من':'ورود';$('avatar').textContent=user?(user.email||'R').slice(0,1).toUpperCase():'R';if(user){await db.from('profiles').upsert({id:user.id,display_name:user.user_metadata?.display_name||''},{onConflict:'id'});await loadProfile();await loadProgress()}home()}
$('authNav').onclick=async()=>{if(user){await db.auth.signOut();user=null;await syncAuth();toast('از حساب خارج شدی')}else showAuth()};$('accountBtn').onclick=()=>user?setView('progress'):showAuth();
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
$('themeBtn').onclick=()=>{light=!light;document.documentElement.style.setProperty('--bg',light?'#f2f5fb':'#0b1020');document.documentElement.style.setProperty('--panel',light?'#ffffff':'#111a2d');document.documentElement.style.setProperty('--panel2',light?'#edf1f8':'#17233a');document.documentElement.style.setProperty('--line',light?'#dce3ef':'#24334e');document.documentElement.style.setProperty('--text',light?'#17233a':'#edf3ff');document.documentElement.style.setProperty('--muted',light?'#65738b':'#91a0b9');$('themeBtn').textContent=light?'☾ حالت تیره':'☼ حالت روشن'};
async function init(){if(!db){toast('کتابخانه اتصال بارگذاری نشد');subjects=fallbackSubjects;home();return}let {data,error}=await db.from('subjects').select('*').eq('is_published',true).order('sort_order');subjects=(!error&&data?.length)?data:fallbackSubjects;await syncAuth()}
init();
</script></body></html>
